id: krea-2-turbo
name: "Krea 2 Turbo"
type: diffusion_model
architecture: krea2
author: Krea / Comfy-Org
license: krea-2-community
homepage: https://huggingface.co/krea/Krea-2-Turbo
description: |
  Krea 2 Turbo — TDM-distilled 12.9B single-stream MMDiT text-to-image model
  by Krea. 8 inference steps at guidance 0.0 with strong photographic
  aesthetics. Text conditioning via 12 tapped Qwen3-VL-4B decoder layers;
  decodes through the Qwen-Image VAE. Supports 1K–2K resolutions.
  Community License: free commercial use under $1M revenue / 50 seats.
  fp8 variant is the Comfy-Org repackage (original krea key layout,
  converted at load time by the modl worker).

variants:
  # --- fp8 scaled (Comfy-Org repackage, default for 24GB cards) ---
  - id: fp8-scaled
    file: krea2_turbo_fp8_scaled.safetensors
    url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/diffusion_models/krea2_turbo_fp8_scaled.safetensors
    sha256: "eb4dd8c612cfd10f64f25b057e6e6bbcb5737c94a7372177e456dbf7579502f1"
    size: 13141730784
    format: safetensors
    precision: fp8
    vram_required: 16384
    vram_recommended: 24576
    note: "fp8 scaled — ~12.5GB VRAM measured on RTX 3090 at 1024px/8 steps. Recommended for 24GB cards."

  # --- bf16 (byte-identical to official krea/Krea-2-Turbo turbo.safetensors) ---
  - id: bf16
    file: krea2_turbo_bf16.safetensors
    url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/diffusion_models/krea2_turbo_bf16.safetensors
    sha256: "78bbf8f4165eda19cea3cb06c78089221932a39e2eed8af9da741f942c47ffb3"
    size: 26283332608
    format: safetensors
    precision: bf16
    vram_required: 32768
    vram_recommended: 40960
    note: "Full precision bf16. Best quality; needs 32GB+ VRAM (or fp8 layerwise casting)."

requires:
  - id: krea2-qwen3-vl-4b-text-encoder
    type: text_encoder
    reason: "Qwen3-VL 4B text encoder (12 tapped decoder layers) for prompt conditioning"
  - id: qwen-image-vae
    type: vae
    reason: "Qwen-Image VAE (f8, 16 latent channels) for decoding latents"

defaults:
  steps: 8
  cfg: 1.0
  sampler: euler
  scheduler: flowmatch

tags:
  - krea
  - text-to-image
  - turbo
  - fast-inference
  - photographic
  - dit
  - mmdit

rating: 4.8
downloads: 0
added: "2026-07-17"
updated: "2026-07-17"
