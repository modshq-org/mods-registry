id: krea-2-raw
name: "Krea 2 Raw"
type: diffusion_model
architecture: krea2
author: Krea / Comfy-Org
license: krea-2-community
homepage: https://huggingface.co/krea/Krea-2-Raw
description: |
  Krea 2 Raw — the base (midtrain) 12.9B single-stream MMDiT text-to-image
  model by Krea, before TDM turbo distillation. Real CFG: negative prompts
  work; community sweet spot is ~20 steps at guidance 3.0. Better identity
  and LoRA fidelity plus stronger seed-to-seed variance than Turbo, at the
  cost of ~2.5x inference time. Nearly all community LoRAs are trained
  against Raw. Pair with krea2-turbo-distill-lora for fast mode (full
  strength ≈ Turbo) or partial-strength quality mode (0.5–0.6, 12–15 steps,
  CFG ~1.5). Text conditioning via 12 tapped Qwen3-VL-4B decoder layers;
  decodes through the Qwen-Image VAE. Supports 1K–2K resolutions.
  Community License: free commercial use under $1M revenue / 50 seats.
  fp8 variant is the Comfy-Org repackage (original krea key layout,
  converted at load time by the modl worker).

variants:
  # --- fp8 scaled (Comfy-Org repackage, default for 24GB cards) ---
  - id: fp8-scaled
    file: krea2_raw_fp8_scaled.safetensors
    url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/diffusion_models/krea2_raw_fp8_scaled.safetensors
    sha256: "48cd5d6c100297968349b41a8e77c6591d1dac18a215807f5f25f59e5c54cd61"
    size: 13141730784
    format: safetensors
    precision: fp8
    vram_required: 16384
    vram_recommended: 24576
    note: "fp8 scaled — same footprint as krea-2-turbo fp8 (~12.5GB). Recommended for 24GB cards."

  # --- bf16 (byte-layout matches official krea/Krea-2-Raw weights) ---
  - id: bf16
    file: krea2_raw_bf16.safetensors
    url: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/diffusion_models/krea2_raw_bf16.safetensors
    sha256: "f99bb0ff8e362b77342bc4994e0c50906fe7ef7074864b181b7d48d2fa6d03d7"
    size: 26283332608
    format: safetensors
    precision: bf16
    vram_required: 32768
    vram_recommended: 40960
    note: "Full precision bf16. Best quality; needs 32GB+ VRAM (or fp8 layerwise casting)."

requires:
  - id: krea2-qwen3-vl-4b-text-encoder
    type: text_encoder
    reason: "Qwen3-VL 4B text encoder (12 tapped decoder layers) for prompt conditioning"
    optional_variant: krea2-qwen3-vl-4b-text-encoder-fp8
  - id: qwen-image-vae
    type: vae
    reason: "Qwen-Image VAE (f8, 16 latent channels) for decoding latents"

defaults:
  steps: 20
  cfg: 3.0
  sampler: euler
  scheduler: flowmatch

tags:
  - krea
  - text-to-image
  - base-model
  - trainable
  - photographic
  - dit
  - mmdit

rating: 4.8
downloads: 0
added: "2026-07-17"
updated: "2026-07-17"
