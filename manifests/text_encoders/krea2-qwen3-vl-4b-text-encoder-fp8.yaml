description: |
  Scaled-fp8 Qwen3-VL 4B text encoder from the Comfy-Org Krea 2 repackage.
  5.2GB vs 8.9GB bf16 — keeps the full Krea 2 stack resident on 24GB cards
  (no offload swapping). Text-side Linear weights are fp8 with per-tensor
  scales; the vision tower is bf16. The modl worker applies the scales at
  load time and computes in bf16 (weights stay fp8 on GPU). Keys are in
  ComfyUI layout (model.layers.*) and normalized by the worker.

