license: krea-2-community
homepage: https://huggingface.co/uzumix/krea2filterbypass3.safetensors
description: |
  Prompt-adherence patch for Krea 2. Krea baked a content filter into the
  released weights that also dampens adherence for benign content: strong
  facial expressions, blood and injuries, unusual body types, and some
  poses come back quietly sanitized. This patch is a single 48-byte weight
  delta on the text-fusion projector (the [1,12] vector that mixes the 12
  tapped Qwen3-VL text-encoder layers) — it rescales the alignment
  directions and adds zero content knowledge. Apply as a LoRA at strength
  0.4–1.0; raise the strength until adherence returns. Works on both
  krea-2-turbo and krea-2-raw. This is a ComfyUI-style additive diff patch,
  not a lora_A/lora_B adapter; the modl worker detects and applies it
  natively ("stripped" variant: touches no visual layers, quality-neutral
  at moderate strength).

