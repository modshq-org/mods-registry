id: krea2-turbo-distill-lora
name: "Krea 2 Turbo Distill LoRA (SVD Extract)"
type: lora
architecture: krea2
author: TheDivergentAI
license: krea-2-community
homepage: https://huggingface.co/TheDivergentAI/krea2-turbo-distill-lora
description: |
  Post-hoc LoRA extracted from the weight delta between Krea-2-Turbo and
  Krea-2-Raw via truncated SVD. Applied to krea-2-raw it approximates Turbo
  behavior without swapping the full checkpoint. Two recipes:
  full strength + 8 steps + CFG 0 ≈ the Turbo model; partial strength
  (0.5–0.6) + 12–15 steps + CFG ~1.5 is the community "quality mode" —
  much better seed variance and fine detail than Turbo while staying fast.
  modl wires both through `--fast` / the workflow `fast:` field on
  krea-2-raw. Unlike Turbo's baked-in distillation, the LoRA stacks with
  character/style LoRAs. Community extract, not an official Krea release;
  hash-pinned.

